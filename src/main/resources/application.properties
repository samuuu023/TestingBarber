spring.application.name=barberia-testing
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/barberia;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret=${JWT_SECRET:demo-key-cambiar-antes-de-produccion-0123456789abcdef}
app.jwt.ttl-seconds=3600
app.admin.email=${ADMIN_EMAIL:admin@barberia.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
server.error.include-message=never
